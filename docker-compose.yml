services:

  # ===============================
  # DATABASES
  # ===============================

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  stats-db:
    image: postgres:16
    environment:
      POSTGRES_USER: stats_user
      POSTGRES_PASSWORD: stats_pass
      POSTGRES_DB: stats_db
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats_user -d stats_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===============================
  # SERVICES
  # ===============================

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - card-service
      - lobby-service

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://auth_user:auth_pass@auth-db:5432/auth_db
      JWT_SECRET: change-this-secret-in-production
      STATS_SERVICE_URL: http://stats-service:5002
      AUTH_SERVICE_URL: http://auth-service:5001
    depends_on:
      auth-db:
        condition: service_healthy

  stats-service:
    build: ./services/stats-service
    environment:
      DATABASE_URL: postgresql://stats_user:stats_pass@stats-db:5432/stats_db
      JWT_SECRET: change-this-secret-in-production
      ADMIN_SECRET: change-this-admin-secret-in-production
    depends_on:
      stats-db:
        condition: service_healthy

  card-service:
    build: ./services/card-service
    environment:
      JWT_SECRET: change-this-secret-in-production
      STATS_SERVICE_URL: http://stats-service:5002
      LOBBY_SERVICE_URL: http://lobby-service:5003
    volumes:
      - ./frontend:/app/frontend
      - ./images:/app/images
    depends_on:
      - auth-service
      - stats-service

  lobby-service:
    build: ./services/lobby-service
    environment:
      JWT_SECRET: change-this-secret-in-production
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

# ===============================
# VOLUMES
# ===============================

volumes:
  auth-db-data:
  stats-db-data: