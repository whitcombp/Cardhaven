<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cardhaven</title>
  <link rel="stylesheet" href="card_pages/card_styles.css" />
  <script src="card_pages/card_script.js" defer></script>
</head>
<body>

<div class="app">

  <header class="header">
    <h1 class="title">Cardhaven</h1>
    <div class="character-selector">
      <select id="character-select"></select>
      <button id="load-character">Load</button>
    </div>
    <input type="text" id="card-search" placeholder="Search cards by name..." />
    <div class="search-actions">
      <button id="save-favorites">Save Favorites</button>
      <button id="clear-favorites">Clear Favorites</button>
      <button id="open-flip-deck">Flip Deck</button>
    </div>
  </header>

  <div class="sticky-bar">
    <nav class="pile-nav">
      <button class="pile-btn active" data-pile="library">Library <span class="pile-count"></span></button>
      <button class="pile-btn" data-pile="hand">Hand <span class="pile-count"></span></button>
      <button class="pile-btn" data-pile="discard">Discard <span class="pile-count"></span></button>
      <button class="pile-btn" data-pile="exhaust">Exhaust <span class="pile-count"></span></button>
    </nav>

    <div class="trackers">
      <div class="tracker">
        <label>Health</label>
        <input type="number" id="health" min="0" value="20">
      </div>
      <div class="tracker">
        <label>XP</label>
        <input type="number" id="xp" min="0" value="0">
      </div>
    </div>
  </div>

  <main class="image-grid" id="pile-container"></main>

</div>

</body>
</html>
