<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loginhaven</title>
  <link rel="stylesheet" href="card_pages/card_styles.css" />
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: #1f1f1f;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-box h2 {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      color: #fff;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field label {
      font-size: 0.85rem;
      color: #aaa;
    }

    .login-field input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }

    .login-field input:focus {
      outline: none;
      border-color: #ff6f61;
      box-shadow: 0 0 6px #ff6f61aa;
    }

    .login-actions {
      display: flex;
      gap: 12px;
    }

    .login-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    #login-btn {
      background: #ff6f61;
      color: #fff;
      box-shadow: 0 4px 10px rgba(255,111,97,0.4);
    }

    #login-btn:hover {
      background: #e05a50;
      box-shadow: 0 4px 14px rgba(255,111,97,0.6);
    }

    #register-btn {
      background: #2a2a2a;
      color: #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    #register-btn:hover {
      background: #333;
      color: #fff;
    }

    .login-error {
      color: #ff6f61;
      font-size: 0.875rem;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-box">
    <h2>Cardhaven</h2>

    <div class="login-field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username" />
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
    </div>

    <div class="login-actions">
      <button id="login-btn">Login</button>
      <button id="register-btn">Register</button>
    </div>

    <p class="login-error" id="login-error"></p>
  </div>
</div>

<script>
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const errorEl = document.getElementById("login-error");

  function showError(msg) {
    errorEl.textContent = msg;
  }

  async function authRequest(endpoint) {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
      showError("Please enter a username and password.");
      return;
    }

    try {
      const res = await fetch(`/${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || "Something went wrong.");
        return;
      }

      localStorage.setItem("token", data.token);
      localStorage.setItem("username", data.user.username);
      localStorage.setItem("user_id", data.user.id);
      localStorage.setItem("is_admin", data.user.is_admin ? "true" : "false");

      // Redirect based on role
      if (data.user.is_admin) {
        window.location.href = "/admin_panel.html";
      } else {
        window.location.href = "/";
      }

    } catch (err) {
      showError("Could not reach auth service.");
    }
  }

  document.getElementById("login-btn").addEventListener("click", () => authRequest("auth/login"));
  document.getElementById("register-btn").addEventListener("click", () => authRequest("auth/register"));

  // Allow enter key to submit
  [usernameInput, passwordInput].forEach(el => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") authRequest("auth/login");
    });
  });

  // Redirect if already logged in
  if (localStorage.getItem("token")) {
    const isAdmin = localStorage.getItem("is_admin") === "true";
    window.location.href = isAdmin ? "/admin_panel.html" : "/";
  }
</script>

</body>
</html>
