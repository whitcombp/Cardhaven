<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cardhaven</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <div class="app">

    <header class="header">
        <h1>Cardhaven</h1>
      
        <!-- Top controls row -->
        <div class="top-controls">
          <!-- Search Bar -->
          <div class="search-container">
            <input type="text" id="card-search" placeholder="Search cards by name..." />
          </div>
      
          <!-- Pile Navigation -->
          <nav class="pile-nav">
            <button class="pile-btn active" data-pile="library">
              Library <span class="pile-count"></span>
            </button>
            <button class="pile-btn" data-pile="hand">
              Hand <span class="pile-count"></span>
            </button>
            <button class="pile-btn" data-pile="discard">
              Discard <span class="pile-count"></span>
            </button>
            <button class="pile-btn" data-pile="exhaust">
              Exhaust <span class="pile-count"></span>
            </button>
          </nav>
      
          <!-- Trackers -->
          <div class="trackers">
            <div class="tracker">
              <label for="health">Health</label>
              <input type="number" id="health" min="0" value="20">
            </div>
            <div class="tracker">
              <label for="xp">XP</label>
              <input type="number" id="xp" min="0" value="0">
            </div>
          </div>
        </div>
      </header>
      

    <!-- Active Pile View -->
    <main class="image-grid" id="pile-container">
      <!-- Cards rendered here -->
    </main>

  </div>

</body>
</html>
