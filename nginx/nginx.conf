events {}

http {
  server {
    listen 80;

    # Card service handles everything by default
    location / {
      proxy_pass http://card-service:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Lobby WebSocket connections
    location ~ ^/lobby/.*/ws$ {
      proxy_pass http://lobby-service:5003;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;  # keep WS alive for long sessions
    }

    # Lobby HTTP endpoints (room creation, etc.)
    location /lobby/ {
      proxy_pass http://lobby-service:5003;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}