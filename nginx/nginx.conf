events {}

http {
  server {
    listen 80;

    # Admin panel page
    location = /admin_panel {
      proxy_pass http://admin-service:5004;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin API routes
    location /admin/ {
      proxy_pass http://admin-service:5004;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Lobby WebSocket connections
    location ~ ^/lobby/.*/ws$ {
      proxy_pass http://lobby-service:5003;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # Lobby HTTP endpoints
    location /lobby/ {
      proxy_pass http://lobby-service:5003;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Card service catch-all (must stay last)
    location / {
      proxy_pass http://card-service:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}